    <script>
      // Applique le thème avant le premier rendu, sinon la page clignote.
      (function () {
        try {
          var choix = localStorage.getItem("theme");
          if (choix === "dark" || choix === "light") {
            document.documentElement.setAttribute("data-theme", choix);
          }
        } catch (e) {
          /* localStorage indisponible : on retombe sur prefers-color-scheme */
        }
      })();
