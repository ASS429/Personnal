<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <title>Arfang Souleymane Sané — Développeur, Gestionnaire & Designer</title>
    <meta name="description" content="Portfolio personnel de Arfang Souleymane Sané — Étudiant en Master MIAGE à l'UGB, développeur full-stack, gestionnaire de projets et designer qui conçoit des produits numériques pour les entreprises africaines." />
    <meta name="author" content="Arfang Souleymane Sané" />

    <meta property="og:title" content="Arfang Souleymane Sané — Développeur, Gestionnaire & Designer" />
    <meta property="og:description" content="Portfolio personnel : développement full-stack, gestion de projets, design et entrepreneuriat depuis Saint-Louis, Sénégal." />
    <meta property="og:type" content="website" />

    <meta name="theme-color" content="#f2f8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#010e18" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Petrona:ital,wght@0,500;0,600;0,700;1,500&display=swap"
    />

    <script>
      // Applique le thème avant le premier rendu, sinon la page clignote.
      (function () {
        try {
          var choix = localStorage.getItem("theme");
          if (choix === "dark" || choix === "light") {
            document.documentElement.setAttribute("data-theme", choix);
          }
        } catch (e) {
          /* localStorage indisponible : on retombe sur prefers-color-scheme */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
